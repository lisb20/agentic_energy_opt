# Configuration for function minimization example
max_iterations: 500
checkpoint_interval: 10

# LLM configuration
llm:
  primary_model: "Pro/zai-org/GLM-4.7"
  # primary_model: "deepseek-ai/DeepSeek-V3.2"
  # primary_model: "llama3.1-8b"
  primary_model_weight: 1
  secondary_model: "gemini-2.5-flash"
  # secondary_model: "llama-4-scout-17b-16e-instruct"
  # secondary_model: "gpt-5-nano"
  secondary_model_weight: 0
  api_base: "https://api.openai.com/v1"
  # api_base: "https://api.cerebras.ai/v1"
  # api_base: "https://api.openai.com/v1"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: "You are an expert programmer specializing in urban energy system. You target is to plan the depolyment of rooftop photovaltic in the city. We will simulate the power demand via Power Flow, and calculate the fitness score at power plants. You need to maximize the combined score (therefore minimize the cost) under the fixed total PV generation."
  # (V2G) "You are an expert programmer specializing in urban energy system. You target is to plan the depolyment of vehicle-to-grid (V2G) in the city. We will simulate the power demand via Power Flow, and calculate the grid operation cost at power plants. You need to minimize the ramping costs by coordinate the charging and discharging of vehicles. "

  num_top_programs: 2                 # Number of top-performing programs to include
  num_diverse_programs: 2  
  include_artifacts: true
  # include_artifacts: false
  max_artifact_bytes: 2048000
  artifact_security_filter: false
  suggest_simplification_after_chars: 1000

# Database configuration
database:
  population_size: 100
  archive_size: 100
  num_islands: 5
  migration_interval: 50            # Migrate every 50 generations
  migration_rate: 0.1               # Migrate 10% of top programs
  elite_selection_ratio: 0.1
  exploitation_ratio: 0.7
  # embedding_model: "text-embedding-3-small"
  similarity_threshold: 0.95
  artifact_size_threshold: 1024

# Evaluator configuration
evaluator:
  timeout: 150
  # cascade_thresholds: [1.3]
  cascade_evaluation: false
  parallel_evaluations: 1

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
